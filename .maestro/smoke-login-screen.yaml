# Smoke test: garante que o app abre e a tela de login renderiza corretamente.
# Não depende de backend/credenciais — só verifica que a UI carregou.
#
# Pré-requisito: `npx expo start` rodando (Metro na porta 8081) e um simulador
# com Expo Go aberto. Rodar com: maestro test .maestro/smoke-login-screen.yaml
#
# URL do Metro: 10.0.2.2 = emulador Android enxergando o host.
# Testando em iOS Simulator, troque para 127.0.0.1.
# Testando em device físico, troque para o IP da sua máquina na rede local.

appId: host.exp.exponent
---
- launchApp:
    clearState: true
- openLink: "exp://10.0.2.2:8081"
- extendedWaitUntil:
    visible: "exemplo@gmail.com"
    timeout: 45000
- assertVisible: "Entrar"
- assertVisible: "Não tem uma conta\\? Cadastre-se"
